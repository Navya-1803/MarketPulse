spring:
  application:
    name: marketpulse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

jwt:
  secret: ${JWT_SECRET:MarketPulseDevSecretKeyThatIsAtLeastThirtyTwoBytesLong!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

market:
  provider: ${MARKET_DATA_PROVIDER:mock}
  cache-ttl-seconds: ${MARKET_CACHE_TTL_SECONDS:30}
  stale-after-minutes: ${MARKET_STALE_AFTER_MINUTES:15}
  finnhub:
    api-key: ${MARKET_DATA_API_KEY:}
    base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
  change:
    notable-percent: 2.0
    significant-percent: 3.0
    critical-percent: 8.0
    volume-anomaly-multiplier: 2.0
    near-extreme-percent: 1.0

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/marketpulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketpulse}
    username: ${DB_USERNAME:marketpulse}
    password: ${DB_PASSWORD:marketpulse}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:marketpulse-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
jwt:
  secret: TestSecretKeyForJwtThatIsLongEnoughForHmacSha256!!
